name: CD

on:
  push:
    tags: ["v*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mywebapp
          POSTGRES_PASSWORD: mywebapp_secret
          POSTGRES_DB: mywebapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mywebapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Run migrations
        run: node src/migrate.js
        env:
          CONFIG_PATH: ./config.ci.json
      - name: Run tests
        run: npm test
        env:
          CONFIG_PATH: ./config.ci.json

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:stable
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Pull image on target
        run: |
          ssh jcm@${{ secrets.TARGET_HOST }} "sudo docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
      - name: Deploy to target
        run: |
          ssh jcm@${{ secrets.TARGET_HOST }} "sudo docker stop mywebapp || true && sudo docker rm mywebapp || true"
          ssh jcm@${{ secrets.TARGET_HOST }} "sudo docker run -d --name mywebapp --network host -e CONFIG_PATH=/app/config.docker.json ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
      - name: Wait for service
        run: sleep 10

  verify:
    name: Verify Deployment
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Check service is alive
        run: |
          STATUS=$(ssh jcm@${{ secrets.TARGET_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/alive")
          echo "Health alive status: $STATUS"
          [ "$STATUS" = "200" ]
      - name: Check nginx proxies correctly
        run: |
          STATUS=$(ssh jcm@${{ secrets.TARGET_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost/tasks")
          echo "Nginx /tasks status: $STATUS"
          [ "$STATUS" = "200" ]
      - name: Check nginx blocks health
        run: |
          STATUS=$(ssh jcm@${{ secrets.TARGET_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost/health/alive")
          echo "Nginx /health/alive status: $STATUS"
          [ "$STATUS" = "404" ]
      - name: Check root endpoint
        run: |
          BODY=$(ssh jcm@${{ secrets.TARGET_HOST }} "curl -s http://localhost/")
          echo "$BODY"
          echo "$BODY" | grep -q "/tasks"
